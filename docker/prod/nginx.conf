# nginx inside the "frontend" container (same image as the app).
# gunicorn serves only pages and API calls, so static files are served here:
#   /assets/...   built CSS, JS and images (from the image)
#   /files/...    public uploads (from the site's folder in the sites volume)
# Everything else goes to the app. The host's nginx handles TLS and sends
# /socket.io straight to the socketio container.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;

    # Runs as the frappe user, so every writable path is under /tmp.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Look up the app container through Docker's DNS on each request (cached 10s),
    # not once at start: a deploy recreates the app container with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        root /home/frappe/frappe-bench/sites;

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000";
        }

        # Uploaded HTML, SVG or XML is downloaded, never rendered on this domain.
        location ~ ^/files/.*\.(htm|html|svg|xml)$ {
            add_header Content-Disposition "attachment";
            try_files /$host/public$uri @app;
        }

        location /files/ {
            try_files /$host/public$uri @app;
        }

        location / {
            try_files /nonexistent @app;
        }

        location @app {
            set $app_upstream http://app:8000;
            proxy_pass $app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 120s;
        }
    }
}
